[bridge]
# Path to the live Sage 50 company folder (the one containing JRNLHDR.DAT,
# LINEITEM.DAT, CUSTOMER.DAT etc). For the sandbox trial run, point this at
# the extracted Bellwether Garden Supply sample data instead of the live
# (currently crash-prone) plalimde company.
sage_company_path = C:\Sage\Peachtree\Company\plalimde

# Placeware backend base URL (no trailing slash). Local Docker trial = localhost:8000.
backend_url = http://localhost:8000

# Tag applied to every synced invoice so the UI can filter by company.
company_id = PlacewareNig

# How often to check JRNLHDR.DAT's modification time, in seconds.
poll_seconds = 30

# Service-account credentials used to obtain a JWT via POST /token.
# For the trial, reuse the existing admin account; replace with a dedicated
# low-privilege "bridge" account before production rollout.
admin_email = admin@placeware.com
admin_pass = pware1234

# Where the bridge persists its sync state / logs (defaults are fine).
state_file = state.json
log_file = bridge.log
