# RoyanHealth (royanhospitalaiapp.online) shares this office's public IP. Ports 80/443 stay Placeware's; RoyanHealth
# is served on :9443 by its own server (172.16.0.26). Let's Encrypt only checks a domain on port 80, so for the
# Royan domain this server passes the check requests on to the Royan server, and sends anything else to :9443.
# Placeware's own traffic (placewareaiapp.online and any other name) never matches this block.
server {
    listen 80;
    server_name royanhospitalaiapp.online;

    location /.well-known/acme-challenge/ {
        proxy_pass http://172.16.0.26;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
    }

    location / {
        return 301 https://$host:9443$request_uri;
    }
}
