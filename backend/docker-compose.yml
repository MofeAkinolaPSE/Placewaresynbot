
services:

  # ── PostgreSQL 18 + pgvector ─────────────────────────────────────────────
  db:
    build:
      context: ./db
    image: placeware-postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Use POSTGRES_PASSWORD from .env in production (docker-compose.prod.yml enforces it).
      # The fallback 'admin1234' is for local dev only — change before going live.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      POSTGRES_DB: synbot_demo
    init: true
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synbot_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — shared TTL cache for agent insights / tool results ───────────
  # Pure performance cache, not a source of truth (everything is
  # recomputable from Postgres) -- no persistence, no host port exposure,
  # only reachable inside the compose network by service name.
  redis:
    image: redis:7-alpine
    container_name: placeware-redis
    command: ["redis-server", "--save", ""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (runs migrations automatically on start) ─────────────
  backend:
    container_name: chat-backend.v1
    image: placeware-backend:latest
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # NeuroLayer licence: drop a signed system.dat in backend/.license/ on the host.
      # Picked up within ~30s, no restart. See tools/licensing/ and the licensing runbook.
      - ./.license:/backend/.license:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  # ── One-shot service: generates a self-signed TLS cert into the ssl_certs
  # named volume. Runs once on first `docker compose up`; skipped if cert
  # already exists. The real certificate replaces it via deploy/issue-cert.ps1.
  certs-init:
    image: alpine:3.19
    container_name: placeware-certs-init
    volumes:
      - ssl_certs:/etc/ssl/placeware
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -f /etc/ssl/placeware/cert.pem ]; then
          apk add --no-cache openssl
          openssl req -x509 -nodes \
            -newkey rsa:2048 \
            -keyout /etc/ssl/placeware/key.pem \
            -out    /etc/ssl/placeware/cert.pem \
            -days   825 \
            -subj   '/CN=placeware-internal/O=Placeware/C=NG' \
            -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
          chmod 640 /etc/ssl/placeware/key.pem
          chmod 644 /etc/ssl/placeware/cert.pem
          echo '[certs-init] Self-signed certificate generated.'
        else
          echo '[certs-init] Certificate already exists, skipping.'
        fi
    restart: "no"

  # ── Let's Encrypt (browser-trusted certificate) ──────────────────────────
  # First certificate: run deploy/issue-cert.ps1 once on the server that the
  # domain points to. After that this service checks twice a day and renews
  # when fewer than 30 days remain, copying the new files into ssl_certs.
  # On a machine with no Let's Encrypt certificate (e.g. a dev laptop) it
  # simply finds nothing to renew and keeps sleeping - harmless.
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: placeware-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ssl_certs:/etc/ssl/placeware
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --quiet --webroot -w /var/www/certbot \
            --deploy-hook 'cp -L "$$RENEWED_LINEAGE/fullchain.pem" /etc/ssl/placeware/cert.pem && cp -L "$$RENEWED_LINEAGE/privkey.pem" /etc/ssl/placeware/key.pem && chmod 644 /etc/ssl/placeware/cert.pem && chmod 640 /etc/ssl/placeware/key.pem'
          sleep 12h & wait $$!
        done
    restart: unless-stopped

  # ── React Frontend served by nginx ───────────────────────────────────────
  frontend:
    container_name: placeware-frontend.v1
    image: placeware-frontend:latest
    build:
      context: ../SynbotUI
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx always reads /etc/ssl/placeware/{cert,key}.pem from this volume.
      # certs-init puts a self-signed pair here on first start; once a real
      # Let's Encrypt certificate is issued (deploy/issue-cert.ps1), the certbot
      # service copies it over the same two files - nginx config never changes.
      - ssl_certs:/etc/ssl/placeware:ro
      # Let's Encrypt's domain check: certbot writes a token here and nginx
      # serves it at http://<domain>/.well-known/acme-challenge/<token>.
      - certbot_www:/var/www/certbot:ro
    # Reload nginx every 6 hours so a renewed certificate is picked up without
    # a restart (certbot renews ~30 days before the 90-day expiry).
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || curl -f http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      certs-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  # ── Prometheus — scrapes /metrics from backend every 15s ───────────────────
  # Access via SSH tunnel only: ssh -L 9090:localhost:9090 user@vm
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: placeware-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"   # bound to loopback — not exposed externally
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - backend

  # ── Grafana — dashboards for request rate, latency, error rate ────────────
  # Access via SSH tunnel only: ssh -L 3000:localhost:3000 user@vm
  # Default login: admin / value of GF_SECURITY_ADMIN_PASSWORD in .env
  grafana:
    image: grafana/grafana:10.4.0
    container_name: placeware-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # bound to loopback — not exposed externally
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme_in_env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  db_data:
    name: placeware_db_data
  grafana_data:
    name: placeware_grafana_data
  ssl_certs:
    name: placeware_ssl_certs
  # Let's Encrypt account, certificates and renewal settings (keep - holds the real cert)
  letsencrypt:
    name: placeware_letsencrypt
  # Let's Encrypt's domain-check tokens, shared by certbot (writes) and nginx (serves)
  certbot_www:
    name: placeware_certbot_www