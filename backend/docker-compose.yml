
services:

  # ── PostgreSQL 18 + pgvector ─────────────────────────────────────────────
  db:
    build:
      context: ./db
    image: placeware-postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: synbot_demo
    init: true
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synbot_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (runs migrations automatically on start) ─────────────
  backend:
    container_name: chat-backend.v1
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s

  # ── React Frontend served by nginx ───────────────────────────────────────
  frontend:
    container_name: placeware-frontend.v1
    build:
      context: ../SynbotUI
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    name: placeware_db_data