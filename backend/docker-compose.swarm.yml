# docker-compose.swarm.yml — Docker Swarm stack for Placeware (zero-downtime deploys)
#
# KEY DIFFERENCE from docker-compose.yml:
#   - Images come from local registry (localhost:5000) — never leaves the client LAN
#   - backend + frontend use  update_config.order: start-first
#     → new container is healthy BEFORE old one is stopped = zero downtime
#   - Auto-rollback if new container fails health check
#   - DB uses stop-first (only one Postgres should run at a time)
#
# USAGE:
#   First time:   sudo bash deploy/init-swarm.sh
#   CI/CD update: IMAGE_TAG=<git-sha> docker stack deploy --prune -c backend/docker-compose.swarm.yml placeware
#
# IMAGE_TAG is injected by the GitHub Actions deploy job (set to git commit SHA).
# Falls back to 'latest' for manual deploys.

services:

  # ── PostgreSQL — stable through app deploys, never rolling-updated ───────────
  db:
    image: localhost:5000/placeware-postgres:18  # Pinned to local registry for Swarm consistency
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set in .env}
      POSTGRES_DB: synbot_demo
    init: true
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      default:
        aliases:
          - db
          - placeware_db
    healthcheck:
      # Check server readiness only; app DB existence is validated separately
      # by deploy/start-stack.sh to avoid unhealthy loops on reused volumes.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first                 # Never run 2 postgres at once
        failure_action: rollback
      restart_policy:
        condition: any                    # Restart on clean exit too — keeps DB always running
        delay: 15s
        max_attempts: 5
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── FastAPI Backend — zero-downtime rolling update ────────────────────────────
  backend:
    image: localhost:5000/placeware-backend:${IMAGE_TAG:-latest}
    command:
      - uvicorn
      - app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "4"
      - --timeout-graceful-shutdown
      - "30"
    env_file:
      - .env                              # Written by GitHub Actions deploy job (chmod 600)
    volumes:
      # NeuroLayer licence (signed system.dat). On the manager node the file lives at
      # /var/lib/docker/volumes/placeware_license/_data/system.dat - see the licensing runbook.
      - license:/backend/.license:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first                # ← KEY: new container healthy before old is removed
        failure_action: rollback          # ← Auto-revert if new container fails health check
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 1500m
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "7"

  # ── React Frontend (nginx) — zero-downtime rolling update ────────────────────
  frontend:
    image: localhost:5000/placeware-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS cert pre-generated by deploy/gen-tls-cert.sh (self-signed)
      # or deploy/setup-letsencrypt.sh (trusted CA cert via Let's Encrypt).
      # Both scripts write to /etc/ssl/placeware/ so nginx config never changes.
      - /etc/ssl/placeware:/etc/ssl/placeware:ro
      # Certbot writes ACME challenge files here during renewal; nginx serves
      # them from /.well-known/acme-challenge/ without a restart.
      - /var/www/certbot:/var/www/certbot:ro
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first                # ← Zero-downtime for frontend too
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Prometheus — metrics scraping (loopback only) ─────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512m

  # ── Grafana — dashboards (loopback only, access via SSH tunnel) ───────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme_in_env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256m

volumes:
  db_data:
  license:
    name: placeware_license
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: overlay
    attachable: true            # Allows manual `docker run --network placeware_default` for debugging
