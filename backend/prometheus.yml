# prometheus.yml — Prometheus scrape configuration for PlacewareBot
#
# Scraped metrics come from the /metrics endpoint exposed by
# prometheus-fastapi-instrumentator on the FastAPI backend.
#
# Access Prometheus UI via SSH tunnel only:
#   ssh -L 9090:localhost:9090 user@192.168.100.84
#   Then open: http://localhost:9090

global:
  scrape_interval:     15s   # How frequently to scrape targets
  evaluation_interval: 15s   # How frequently to evaluate alerting rules
  scrape_timeout:      10s

scrape_configs:
  - job_name: "placeware-backend"
    # Backend service on Docker internal network
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scheme: "http"

  - job_name: "prometheus"
    # Prometheus self-monitoring
    static_configs:
      - targets: ["localhost:9090"]
