    department:
      sources: ["department", "Department", "Dept"]
      
    role:
      sources: ["role", "Role", "Position", "Title", "Job Title"]
      
    status:
      sources: ["status", "Status", "Employment Status"]
      default: "active"
  
  enum_mappings:
    status:
      "active": "active"
      "inactive": "inactive"
      "terminated": "terminated"
      "on_leave": "on_leave"
      "1": "active"
      "0": "inactive"

