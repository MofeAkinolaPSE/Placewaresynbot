# Normalization Rules Configuration
# Config-driven field mappings for enterprise data pipeline
# All domain-specific behavior is defined here - no hardcoding in code

# =============================================================================
# Sage 50 Dataset Configurations
# =============================================================================

sage_customers:
  dataset_name: customers
  description: "Customer master data from Sage 50"
  
  field_mappings:
    customer_id:
      sources: ["customer_id", "CustomerID", "ID", "Customer ID", "Cust ID"]
      required: true
      
    name:
      sources: ["name", "Name", "CustomerName", "customer_name", "Company Name"]
      required: true
      
    email:
      sources: ["email", "Email", "EmailAddress", "E-mail"]
      transform: lowercase
      
    phone:
      sources: ["phone", "Phone", "PhoneNumber", "phone_number", "Telephone"]
      
    status:
      sources: ["status", "Status", "CustomerStatus", "Active"]
      default: "active"
      
    address:
      sources: ["address", "Address", "Street Address", "Address1"]
      
    city:
      sources: ["city", "City"]
      
    state:
      sources: ["state", "State", "Province"]
      
    postal_code:
      sources: ["postal_code", "PostalCode", "Zip", "ZIP Code"]
      
    country:
      sources: ["country", "Country"]
      default: "NG"
  
  enum_mappings:
    status:
      "active": "active"
      "inactive": "inactive"
      "pending": "pending"
      "suspended": "suspended"
      "1": "active"
      "0": "inactive"
      "true": "active"
      "false": "inactive"
      "yes": "active"
      "no": "inactive"

sage_ar:
  dataset_name: ar
  description: "Accounts Receivable from Sage 50"
  
  field_mappings:
    customer_id:
      sources: ["customer_id", "CustomerID", "Customer ID"]
      required: true
      
    invoice_id:
      sources: ["invoice_id", "InvoiceID", "Invoice Number", "InvoiceNo"]
      
    amount:
      sources: ["amount", "Amount", "Total", "Invoice Amount", "Balance"]
      transform: decimal
      required: true
      
    due_date:
      sources: ["due_date", "DueDate", "Due Date", "Due"]
      transform: timestamp
      
    invoice_date:
      sources: ["invoice_date", "InvoiceDate", "Invoice Date", "Date"]
      transform: timestamp
      
    status:
      sources: ["status", "Status", "Payment Status"]
      default: "open"
  
  enum_mappings:
    status:
      "open": "open"
      "paid": "paid"
      "overdue": "overdue"
      "partial": "partial"
      "outstanding": "open"
      "fully paid": "paid"
      "partially paid": "partial"

sage_ap:
  dataset_name: ap
  description: "Accounts Payable from Sage 50"
  
  field_mappings:
    vendor_id:
      sources: ["vendor_id", "VendorID", "Vendor ID", "SupplierID"]
      required: true
      
    invoice_id:
      sources: ["invoice_id", "InvoiceID", "Invoice Number", "Bill Number"]
      
    amount:
      sources: ["amount", "Amount", "Total", "Bill Amount", "Balance"]
      transform: decimal
      required: true
      
    due_date:
      sources: ["due_date", "DueDate", "Due Date"]
      transform: timestamp
      
    status:
      sources: ["status", "Status", "Payment Status"]
      default: "open"
  
  enum_mappings:
    status:
      "open": "open"
      "paid": "paid"
      "overdue": "overdue"
      "partial": "partial"

sage_gl:
  dataset_name: gl
  description: "General Ledger from Sage 50"
  
  field_mappings:
    account_code:
      sources: ["account_code", "AccountCode", "Account Code", "Account No", "Acct"]
      required: true
      
    account_name:
      sources: ["account_name", "AccountName", "Account Name", "Description"]
      
    debit:
      sources: ["debit", "Debit", "Debit Amount"]
      transform: decimal
      
    credit:
      sources: ["credit", "Credit", "Credit Amount"]
      transform: decimal
      
    balance:
      sources: ["balance", "Balance", "Net"]
      transform: decimal
      
    transaction_date:
      sources: ["transaction_date", "TransactionDate", "Date", "Trans Date"]
      transform: timestamp

sage_inventory:
  dataset_name: inventory
  description: "Inventory items from Sage 50"
  
  field_mappings:
    sku:
      sources: ["sku", "SKU", "ProductCode", "ItemCode", "Item Code", "Product ID"]
      required: true
      
    name:
      sources: ["name", "Name", "Description", "ProductName", "Item Description"]
      required: true
      
    quantity:
      sources: ["quantity", "Quantity", "qty", "Qty", "on_hand", "On Hand", "Stock"]
      transform: integer
      
    price:
      sources: ["price", "Price", "UnitPrice", "unit_price", "Selling Price"]
      transform: decimal
      
    cost:
      sources: ["cost", "Cost", "UnitCost", "unit_cost", "Purchase Price"]
      transform: decimal
      
    category:
      sources: ["category", "Category", "Product Category", "Type"]
      
    reorder_level:
      sources: ["reorder_level", "ReorderLevel", "Min Stock", "Minimum"]
      transform: integer

sage_staff:
  dataset_name: staff
  description: "Staff/Employee master data from Sage 50"
  
  field_mappings:
    staff_id:
      sources: ["staff_id", "StaffID", "employee_id", "EmployeeID", "ID"]
      required: true
      
    name:
