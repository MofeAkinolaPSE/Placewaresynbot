# =============================================================================
# Transform Definitions (referenced in field_mappings)
# =============================================================================

transforms:
  lowercase:
    type: "string"
    function: "str.lower()"
    
  decimal:
    type: "numeric"
    function: "parse_decimal"
    strip_chars: ["$", ",", "₦"]
    
  integer:
    type: "numeric"
    function: "int(float())"
    
  timestamp:
    type: "date"
    formats:
      - "%Y-%m-%d"
      - "%Y-%m-%dT%H:%M:%S"
      - "%Y-%m-%dT%H:%M:%SZ"
      - "%Y-%m-%dT%H:%M:%S.%f"
      - "%d/%m/%Y"
      - "%m/%d/%Y"
      - "%Y%m%d"
      - "%d-%m-%Y"
      - "%d %b %Y"
    output_format: "ISO8601"

# =============================================================================
# Global Settings
# =============================================================================

settings:
  # Default timestamp output format
  timestamp_output: "ISO8601Z"
  
  # Missing value handling
  null_values: ["", "null", "NULL", "N/A", "n/a", "-", "None", "NONE"]
  
  # Case sensitivity for enum matching
  enum_case_insensitive: true
  
  # Enable strict validation (fail on unknown fields)
  strict_mode: false
