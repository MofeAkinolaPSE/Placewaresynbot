name: Deploy to Production VM

# Triggered on every push to main or manually from the Actions tab.
# Requires a GitHub Actions self-hosted runner installed on the Ubuntu VM.
# See scripts/install-runner.sh for one-command runner setup.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force Docker image rebuild (--no-cache)'
        required: false
        default: false
        type: boolean
      domain:
        description: "Optional public domain for Let's Encrypt (e.g. app.example.com)"
        required: false
        default: ''
        type: string
      le_email:
        description: "Optional email for Let's Encrypt registration/expiry notices"
        required: false
        default: ''
        type: string

jobs:
  # ── Job 1: Run tests first (reuses existing CI job logic) ──────────────────
  test:
    runs-on: ubuntu-latest
    # Spin up a real Postgres so LocalDBClient can initialise at import time
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: synbot_test
        ports:
          - 5432:5432
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/synbot_test
      DEEPSEEK_API_KEY: test-key-ci
      JWT_SECRET: ci-test-secret-not-used-in-prod
      ADMIN_EMAIL: admin@placeware.com
      ADMIN_PASSWORD: testpass
      DEV_TOKEN_ENABLED: "0"
      SAGE_MOCK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

  # ── Job 2: Security scanning (runs parallel to test) ───────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + Bandit
        run: pip install -r backend/requirements.txt bandit

      - name: SAST scan (Bandit)
        # -ll = medium severity and above; --exit-zero = warn only (tighten after first review)
        run: |
          bandit -r backend/src -ll -f json -o bandit-report.json || true
          bandit -r backend/src -ll --exit-zero

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 30

      - name: Install Trivy
        # Install via Aqua Security's official APT repo — avoids GitHub Releases
        # rate-limiting and binary download failures seen with the install.sh approach.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Trivy filesystem vulnerability scan
        # exit-code 0 = warn-only (non-blocking) until CVEs are reviewed and resolved.
        # Change to --exit-code 1 once the reported CVEs are fixed or ignored.
        run: |
          trivy fs \
            --exit-code 0 \
            --ignore-unfixed \
            --vuln-type library \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt \
            backend/
          cat trivy-report.txt

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-cve-report
          path: trivy-report.txt
          retention-days: 30

  # ── Job 3: Deploy to VM via self-hosted runner ─────────────────────────────
  deploy:
    needs: [test, security]
    runs-on: [self-hosted, linux, placeware-vm]

    steps:
      # Checkout to $GITHUB_WORKSPACE — works for any runner user (moeakin,
      # runner, root, etc.) without hardcoding a home directory path.
      - uses: actions/checkout@v4

      - name: Preflight - validate required deploy secrets
        # Fail fast before any build/deploy work if critical secrets are unset.
        # This prevents mid-pipeline failures during image build, runtime boot,
        # SMTP delivery, or DB auth.
        env:
          _DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          _DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          _EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          _EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          _POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _SAGE_BRIDGE_URL: ${{ secrets.SAGE_BRIDGE_URL }}
          _SAGE_BRIDGE_KEY: ${{ secrets.SAGE_BRIDGE_KEY }}
          _SAGE_BRIDGE_WEBHOOK_SECRET: ${{ secrets.SAGE_BRIDGE_WEBHOOK_SECRET }}
          _GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          missing=0

          require_non_empty() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "ERROR: Required GitHub secret '$name' is missing or empty."
              missing=1
            fi
          }

          require_non_empty "DEEPSEEK_API_KEY" "$_DEEPSEEK_API_KEY"
          require_non_empty "DEEPSEEK_MODEL" "$_DEEPSEEK_MODEL"
          require_non_empty "EMAIL_FROM" "$_EMAIL_FROM"
          require_non_empty "EMAIL_PASS" "$_EMAIL_PASS"
          require_non_empty "POSTGRES_PASSWORD" "$_POSTGRES_PASSWORD"
          require_non_empty "JWT_SECRET" "$_JWT_SECRET"
          require_non_empty "ADMIN_PASSWORD" "$_ADMIN_PASSWORD"
          require_non_empty "SAGE_BRIDGE_URL" "$_SAGE_BRIDGE_URL"
          require_non_empty "SAGE_BRIDGE_KEY" "$_SAGE_BRIDGE_KEY"
          require_non_empty "SAGE_BRIDGE_WEBHOOK_SECRET" "$_SAGE_BRIDGE_WEBHOOK_SECRET"
          require_non_empty "GRAFANA_PASSWORD" "$_GRAFANA_PASSWORD"

          if [ "$missing" -ne 0 ]; then
            echo "One or more required deploy secrets are missing. Aborting deployment."
            exit 1
          fi

          echo "Preflight passed: required deploy secrets are present."

      # ── Bootstrap (idempotent — fast no-op on every deploy after the first) ──

      - name: Ensure Docker Swarm is initialized
        # First deploy: initializes a single-node swarm on the VM.
        # Subsequent deploys: checks state and skips in < 1 second.
        run: |
          STATE=$(docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null || echo "inactive")
          if [ "$STATE" != "active" ]; then
            echo "Swarm not active (state=$STATE) — initializing single-node swarm..."
            docker swarm init --advertise-addr 127.0.0.1
            echo "Swarm initialized."
          else
            echo "Swarm already active — skipping init."
          fi

      - name: Ensure local Docker registry is running
        # The private registry at localhost:5000 must be running before images
        # can be pushed to it. Images are stored in a named volume (registry_data)
        # and survive VM reboots. The registry is bound to 127.0.0.1 only —
        # it is never reachable from outside the VM.
        #
        # First deploy:      creates the container + volume.
        # Container stopped: starts it.
        # Already running:   skips in < 1 second.
        run: |
          RUNNING=$(docker inspect placeware-registry --format '{{.State.Running}}' 2>/dev/null || echo "missing")
          if [ "$RUNNING" = "true" ]; then
            echo "Registry already running at localhost:5000 — skipping."
          elif [ "$RUNNING" = "false" ]; then
            echo "Registry container exists but stopped — starting it..."
            docker start placeware-registry
            sleep 2
          else
            echo "Registry container missing — creating it..."
            docker volume create registry_data 2>/dev/null || true
            docker run -d \
              --name placeware-registry \
              --restart always \
              -p 127.0.0.1:5000:5000 \
              -v registry_data:/var/lib/registry \
              registry:2
            sleep 2
          fi
          # Verify the registry responds before proceeding to the build steps.
          curl -sf http://localhost:5000/v2/ || {
            echo "ERROR: Registry at localhost:5000 not responding after start attempt."
            docker logs placeware-registry --tail 20 || true
            exit 1
          }
          echo "Registry healthy at localhost:5000."

      # ── Postgres corruption auto-recovery ────────────────────────────────────

      - name: Auto-recover corrupt Postgres volume (if detected)
        # Detects Postgres WAL corruption (PANIC in logs) that occurs after an
        # unclean VM shutdown and automatically removes the broken named volume.
        # The subsequent docker stack deploy then creates a fresh empty volume
        # and Postgres initialises cleanly from scratch.
        #
        # Safety contract:
        #  - Skips entirely on first deploy (volume does not exist yet).
        #  - Only removes the volume when the PANIC/corruption string is
        #    confirmed in service or container logs — never on a healthy volume.
        #  - Scales the db service to 0 first so Docker releases the volume lock
        #    before we attempt removal.
        run: |
          VOLUME_NAME="placeware_db_data"
          CORRUPT=0

          # First deploy — volume doesn't exist yet, nothing to check.
          if ! docker volume inspect "$VOLUME_NAME" >/dev/null 2>&1; then
            echo "Volume $VOLUME_NAME not found — first deploy, skipping recovery check."
            exit 0
          fi

          # ── Check Swarm service logs (if service is already running) ──────────
          if docker service inspect placeware_db >/dev/null 2>&1; then
            if docker service logs placeware_db --tail 200 2>&1 \
                | grep -qE "PANIC|could not locate a valid checkpoint|invalid page (header|in block)"; then
              echo "Postgres corruption detected in Swarm service logs."
              CORRUPT=1
            fi
          fi

          # ── Also check any stopped containers still holding the volume ────────
          if [ "$CORRUPT" = "0" ]; then
            CONTAINERS=$(docker ps -a --filter "volume=$VOLUME_NAME" --format '{{.ID}}')
            for cid in $CONTAINERS; do
              if docker logs "$cid" 2>&1 \
                  | grep -qE "PANIC|could not locate a valid checkpoint|invalid page (header|in block)"; then
                echo "Postgres corruption detected in stopped container $cid."
                CORRUPT=1
                break
              fi
            done
          fi

          if [ "$CORRUPT" = "0" ]; then
            echo "Postgres volume $VOLUME_NAME is healthy — skipping recovery."
            exit 0
          fi

          echo "=== AUTO-RECOVERY: corrupt Postgres volume detected ==="

          # Scale the db Swarm service to 0 to release the volume lock gracefully.
          if docker service inspect placeware_db >/dev/null 2>&1; then
            echo "Scaling placeware_db to 0 replicas to release volume lock..."
            docker service update --replicas 0 placeware_db || true
            sleep 10
          fi

          # Force-remove any remaining stopped containers still pinning the volume.
          CONTAINERS=$(docker ps -a --filter "volume=$VOLUME_NAME" --format '{{.ID}}')
          for cid in $CONTAINERS; do
            echo "Force-removing container $cid (held volume lock)..."
            docker rm -f "$cid" || true
          done

          # Remove the corrupt volume — Swarm recreates it clean on next deploy.
          echo "Removing corrupt volume $VOLUME_NAME..."
          if docker volume rm "$VOLUME_NAME"; then
            echo "Volume removed. Fresh Postgres will initialise on deploy."
          else
            echo "ERROR: Volume removal failed. Remaining holders:"
            docker ps -a --filter "volume=$VOLUME_NAME" || true
            exit 1
          fi

          echo "=== AUTO-RECOVERY complete ==="

      # ── Secrets injection ────────────────────────────────────────────────────

      - name: Write .env from GitHub Secrets
        # Injects all secrets into the checked-out workspace — eliminates any
        # manually-maintained .env file on the VM.
        # Add each variable: GitHub repo → Settings → Secrets and variables → Actions.
        #
        # SECURITY: secrets are bound to step env vars so GitHub masks them in
        # logs and they are never raw-interpolated into shell strings
        # (prevents metacharacter injection — OWASP A03).
        env:
          _DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          _DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          _EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          _EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          _POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _SAGE_BRIDGE_URL: ${{ secrets.SAGE_BRIDGE_URL }}
          _SAGE_BRIDGE_KEY: ${{ secrets.SAGE_BRIDGE_KEY }}
          _SAGE_BRIDGE_WEBHOOK_SECRET: ${{ secrets.SAGE_BRIDGE_WEBHOOK_SECRET }}
          _GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          # printf '%s' prevents backslash-sequence interpretation in secret values.
          # $GITHUB_WORKSPACE is always set by the runner — no hardcoded paths.
          {
            printf 'DEEPSEEK_API_KEY=%s\n'            "$_DEEPSEEK_API_KEY"
            printf 'DEEPSEEK_MODEL=%s\n'              "$_DEEPSEEK_MODEL"
            printf 'EMAIL_FROM=%s\n'                  "$_EMAIL_FROM"
            printf 'EMAIL_PASS=%s\n'                  "$_EMAIL_PASS"
            printf 'POSTGRES_PASSWORD=%s\n'           "$_POSTGRES_PASSWORD"
            printf 'DATABASE_URL=postgresql://postgres:%s@db:5432/synbot_demo\n' "$_POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n'                  "$_JWT_SECRET"
            printf 'ADMIN_EMAIL=%s\n'                 "${_ADMIN_EMAIL:-}"
            printf 'ADMIN_PASSWORD=%s\n'              "$_ADMIN_PASSWORD"
            printf 'SAGE_BRIDGE_URL=%s\n'             "$_SAGE_BRIDGE_URL"
            printf 'SAGE_BRIDGE_KEY=%s\n'             "$_SAGE_BRIDGE_KEY"
            printf 'SAGE_BRIDGE_WEBHOOK_SECRET=%s\n'  "$_SAGE_BRIDGE_WEBHOOK_SECRET"
            printf 'GRAFANA_PASSWORD=%s\n'            "$_GRAFANA_PASSWORD"
            printf 'SAGE_MOCK=0\n'
            printf 'DEV_TOKEN_ENABLED=0\n'
          } > "$GITHUB_WORKSPACE/backend/.env"
          chmod 600 "$GITHUB_WORKSPACE/backend/.env"

      - name: Determine build flags
        id: flags
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "build_args=--no-cache" >> "$GITHUB_OUTPUT"
          else
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image to local registry
        # Builds with git SHA tag for traceability, also tags :latest for fallback.
        # localhost:5000 is the private registry started by deploy/init-swarm.sh —
        # images never leave the client server LAN.
        run: |
          IMAGE_TAG="${{ github.sha }}"
          BUILD_ARGS="${{ steps.flags.outputs.build_args }}"
          cd "$GITHUB_WORKSPACE/backend"
          docker build $BUILD_ARGS \
            -t "localhost:5000/placeware-backend:$IMAGE_TAG" \
            -t "localhost:5000/placeware-backend:latest" \
            .
          docker push "localhost:5000/placeware-backend:$IMAGE_TAG"
          docker push "localhost:5000/placeware-backend:latest"
          echo "Backend image pushed: localhost:5000/placeware-backend:$IMAGE_TAG"

      - name: Build and push frontend image to local registry
        run: |
          IMAGE_TAG="${{ github.sha }}"
          BUILD_ARGS="${{ steps.flags.outputs.build_args }}"
          cd "$GITHUB_WORKSPACE/SynbotUI"
          docker build $BUILD_ARGS \
            -t "localhost:5000/placeware-frontend:$IMAGE_TAG" \
            -t "localhost:5000/placeware-frontend:latest" \
            .
          docker push "localhost:5000/placeware-frontend:$IMAGE_TAG"
          docker push "localhost:5000/placeware-frontend:latest"
          echo "Frontend image pushed: localhost:5000/placeware-frontend:$IMAGE_TAG"

      # ── Pre-deploy environment checks (idempotent) ──────────────────────────

      - name: Ensure Postgres image is built on this node
        # placeware-postgres:18 is built from ./db/Dockerfile on the VM itself —
        # it is NOT pushed to the local registry (one-node cluster, no need).
        # Rebuild whenever the image is missing (first deploy, node rebuild, prune).
        run: |
          if docker image inspect placeware-postgres:18 >/dev/null 2>&1; then
            echo "placeware-postgres:18 already exists on this node — skipping build."
          else
            echo "placeware-postgres:18 not found — building from db/Dockerfile..."
            docker build -t placeware-postgres:18 "$GITHUB_WORKSPACE/backend/db"
            echo "Postgres image built successfully."
          fi

      - name: Ensure TLS certificate exists for frontend
        # Two modes:
        #   A) DOMAIN secret is set → obtain/renew a browser-trusted Let's Encrypt cert.
        #      Requires port 80 reachable from internet. certbot uses webroot mode so
        #      nginx stays running (no downtime). Cert auto-renews via systemd timer.
        #   B) DOMAIN not set → generate a self-signed cert (browsers will warn).
        #      Safe for internal testing; upgrade to mode A before client demos.
        #
        # Optional manual inputs for cert provisioning on workflow_dispatch.
        # On push triggers these resolve to empty strings and the workflow
        # falls back to self-signed cert mode.
        env:
          _DOMAIN:   ${{ github.event.inputs.domain || '' }}
          _LE_EMAIL: ${{ github.event.inputs.le_email || '' }}
        run: |
          CERT_DIR="/etc/ssl/placeware"
          WEBROOT="/var/www/certbot"

          if [ -n "$_DOMAIN" ]; then
            # ── Mode A: Let's Encrypt (trusted CA cert) ───────────────────────
            echo "DOMAIN secret is set — using Let's Encrypt for $_DOMAIN"

            # Install certbot if missing
            if ! command -v certbot &>/dev/null; then
              echo "Installing certbot..."
              sudo apt-get update -qq
              sudo apt-get install -y certbot
            fi

            # Ensure webroot exists (nginx serves ACME challenge from here)
            sudo mkdir -p "$WEBROOT"

            # Request or renew cert (--keep-until-expiring = no-op if valid > 30d)
            EMAIL_FLAG=""
            if [ -n "$_LE_EMAIL" ]; then
              EMAIL_FLAG="--email $_LE_EMAIL"
            else
              EMAIL_FLAG="--register-unsafely-without-email"
            fi

            sudo certbot certonly \
              --webroot \
              --webroot-path "$WEBROOT" \
              --domain "$_DOMAIN" \
              $EMAIL_FLAG \
              --agree-tos \
              --non-interactive \
              --keep-until-expiring

            LE_LIVE="/etc/letsencrypt/live/$_DOMAIN"
            sudo mkdir -p "$CERT_DIR"
            sudo cp -f "$LE_LIVE/fullchain.pem" "$CERT_DIR/cert.pem"
            sudo cp -f "$LE_LIVE/privkey.pem"   "$CERT_DIR/key.pem"
            sudo chmod 644 "$CERT_DIR/cert.pem"
            sudo chmod 640 "$CERT_DIR/key.pem"
            EXPIRY=$(sudo openssl x509 -noout -enddate -in "$CERT_DIR/cert.pem" | cut -d= -f2)
            echo "Let's Encrypt cert installed (expires: $EXPIRY)."

            # Install renewal deploy hook so nginx reloads after auto-renewal.
            # The hook script lives in deploy/cert-renewal-hook.sh in the repo —
            # avoids heredocs which break YAML literal block scalar parsing.
            HOOK="/etc/letsencrypt/renewal-hooks/deploy/placeware-reload.sh"
            if [ ! -f "$HOOK" ]; then
              sudo mkdir -p "$(dirname "$HOOK")"
              sudo cp "$GITHUB_WORKSPACE/deploy/cert-renewal-hook.sh" "$HOOK"
              sudo chmod +x "$HOOK"
              echo "Renewal deploy hook installed."
            fi

            # Enable daily renewal check via systemd (best effort — may not exist)
            sudo systemctl enable certbot.timer 2>/dev/null && \
            sudo systemctl start  certbot.timer 2>/dev/null || \
            echo "Tip: Add cron for renewal: '0 3 * * * certbot renew --quiet'"

          else
            # ── Mode B: Self-signed fallback (browser will warn) ──────────────
            if [ -f "$CERT_DIR/cert.pem" ] && [ -f "$CERT_DIR/key.pem" ]; then
              echo "TLS cert already exists at $CERT_DIR — skipping self-signed generation."
            else
              echo "No DOMAIN secret and no cert found — generating self-signed cert."
              echo "Set the DOMAIN GitHub secret to get a browser-trusted cert automatically."
              VM_IP=$(hostname -I | awk '{print $1}')
              sudo mkdir -p "$CERT_DIR"
              sudo openssl req -x509 -nodes \
                -newkey rsa:2048 \
                -keyout "$CERT_DIR/key.pem" \
                -out    "$CERT_DIR/cert.pem" \
                -days   825 \
                -subj   "/CN=placeware/O=Placeware/C=NG" \
                -addext "subjectAltName=IP:${VM_IP},IP:127.0.0.1,DNS:localhost"
              sudo chmod 640 "$CERT_DIR/key.pem"
              sudo chmod 644 "$CERT_DIR/cert.pem"
              echo "Self-signed TLS cert generated for IP $VM_IP."
            fi
          fi

      - name: Rolling deploy via Docker Swarm
        # docker stack deploy resolves ${VAR} placeholders in compose files from
        # the SHELL ENVIRONMENT — it does NOT read .env files automatically
        # (unlike 'docker compose up'). We source .env first so every variable
        # referenced in docker-compose.swarm.yml (POSTGRES_PASSWORD, IMAGE_TAG,
        # etc.) is available for interpolation.
        #
        # Rolling update sequence (zero downtime):
        #   1. New container starts on new image
        #   2. Health check passes (start_period: 90s)
        #   3. Old container stops
        # Auto-rollback if health check fails.
        run: |
          IMAGE_TAG="${{ github.sha }}"
          cd "$GITHUB_WORKSPACE/backend"

          # Export every variable in .env into the current shell so docker stack
          # deploy can interpolate them. set -a auto-exports all assignments;
          # set +a restores normal behaviour after sourcing.
          set -a
          # shellcheck source=/dev/null
          source .env
          set +a

          IMAGE_TAG="$IMAGE_TAG" docker stack deploy \
            --with-registry-auth \
            --prune \
            -c docker-compose.swarm.yml \
            placeware
          echo "Stack deploy triggered. Swarm is performing rolling update..."

      - name: Wait for Postgres to be ready
        # Backend crashes on startup if it reaches Postgres before pg_isready.
        # Swarm ignores depends_on — we must gate here before checking backend.
        run: |
          echo "Waiting up to 90s for placeware_db to pass its health check..."
          for i in $(seq 1 18); do
            REPLICAS=$(docker service ls --filter name=placeware_db --format '{{.Replicas}}' 2>/dev/null || echo "0/1")
            echo "Attempt $i/18: placeware_db replicas = $REPLICAS"
            if [ "$REPLICAS" = "1/1" ]; then
              echo "Postgres is up — 1/1 replicas running."
              break
            fi
            sleep 5
          done
          REPLICAS=$(docker service ls --filter name=placeware_db --format '{{.Replicas}}' 2>/dev/null || echo "0/1")
          if [ "$REPLICAS" != "1/1" ]; then
            echo "ERROR: Postgres did not converge after 90s (replicas=$REPLICAS)"
            docker service logs placeware_db --tail 50 || true
            docker stack ps placeware --no-trunc || true
            exit 1
          fi

      - name: Wait for backend health (post-deploy)
        # Port 8000 is internal to the Swarm overlay network and NOT published
        # to the host — curl localhost:8000 will always fail from the runner shell.
        # Instead, ask Swarm directly: wait until backend reports 1/1 replicas.
        run: |
          echo "Waiting up to 150s for Swarm to converge the backend service..."
          for i in $(seq 1 30); do
            REPLICAS=$(docker service ls --filter name=placeware_backend --format '{{.Replicas}}' 2>/dev/null || echo "0/1")
            echo "Attempt $i/30: placeware_backend replicas = $REPLICAS"
            if [ "$REPLICAS" = "1/1" ]; then
              echo "Backend service healthy — 1/1 replicas running."
              break
            fi
            sleep 5
          done
          REPLICAS=$(docker service ls --filter name=placeware_backend --format '{{.Replicas}}' 2>/dev/null || echo "0/1")
          if [ "$REPLICAS" != "1/1" ]; then
            echo "FAILED: placeware_backend not converged after 150s (replicas=$REPLICAS)"
            docker service logs placeware_backend --tail 50 || true
            docker stack ps placeware --no-trunc || true
            exit 1
          fi

      - name: Wait for frontend health (post-deploy)
        # Frontend publishes port 443 to the host, so curl works here.
        # -k skips certificate verification (self-signed cert is expected).
        # Also verify via Swarm replica count as a belt-and-suspenders check.
        run: |
          echo "Waiting up to 60s for frontend service..."
          for i in $(seq 1 12); do
            REPLICAS=$(docker service ls --filter name=placeware_frontend --format '{{.Replicas}}' 2>/dev/null || echo "0/1")
            echo "Attempt $i/12: placeware_frontend replicas = $REPLICAS"
            if [ "$REPLICAS" = "1/1" ]; then
              echo "Frontend service healthy — 1/1 replicas running."
              break
            fi
            sleep 5
          done
          REPLICAS=$(docker service ls --filter name=placeware_frontend --format '{{.Replicas}}' 2>/dev/null || echo "0/1")
          if [ "$REPLICAS" != "1/1" ]; then
            echo "FAILED: placeware_frontend not converged (replicas=$REPLICAS)"
            docker service logs placeware_frontend --tail 30 || true
            exit 1
          fi
          echo "Frontend healthy."

      - name: Prune unused Docker images
        run: docker image prune -f

      - name: Deployment summary
        run: |
          echo "=== Deployment complete (Swarm rolling update) ==="
          docker stack ps placeware --no-trunc
          echo ""
          echo "Image tag: ${{ github.sha }}"
