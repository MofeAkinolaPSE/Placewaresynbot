name: Deploy to Production VM

# Triggered on every push to main or manually from the Actions tab.
# Requires a GitHub Actions self-hosted runner installed on the Ubuntu VM.
# See scripts/install-runner.sh for one-command runner setup.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force Docker image rebuild (--no-cache)'
        required: false
        default: false
        type: boolean

jobs:
  # ── Job 1: Run tests first (reuses existing CI job logic) ──────────────────
  test:
    runs-on: ubuntu-latest
    # Spin up a real Postgres so LocalDBClient can initialise at import time
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: synbot_test
        ports:
          - 5432:5432
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/synbot_test
      DEEPSEEK_API_KEY: test-key-ci
      JWT_SECRET: ci-test-secret-not-used-in-prod
      ADMIN_EMAIL: admin@placeware.com
      ADMIN_PASSWORD: testpass
      DEV_TOKEN_ENABLED: "0"
      SAGE_MOCK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

  # ── Job 2: Security scanning (runs parallel to test) ───────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + Bandit
        run: pip install -r backend/requirements.txt bandit

      - name: SAST scan (Bandit)
        # -ll = medium severity and above; --exit-zero = warn only (tighten after first review)
        run: |
          bandit -r backend/src -ll -f json -o bandit-report.json || true
          bandit -r backend/src -ll --exit-zero

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 30

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.51.4

      - name: Trivy filesystem vulnerability scan
        # Saves full CVE report as artifact so we can review what was found.
        # exit-code 0 = warn only (non-blocking) until we review and fix/ignore the CVE.
        # Change to --exit-code 1 once the reported CVEs are resolved.
        run: |
          trivy fs \
            --exit-code 0 \
            --ignore-unfixed \
            --vuln-type library \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt \
            backend/ || true
          cat trivy-report.txt

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-cve-report
          path: trivy-report.txt
          retention-days: 30

  # ── Job 3: Deploy to VM via self-hosted runner ─────────────────────────────
  deploy:
    needs: [test, security]
    runs-on: [self-hosted, linux, placeware-vm]
    env:
      # Explicit path avoids $HOME linter false-positives and works for any
      # runner user (root or a named service account).
      DEPLOY_DIR: /home/runner/Placewaresynbot

    steps:
      - name: Write .env from GitHub Secrets
        # Injects all secrets onto the VM — eliminates manually-maintained .env file.
        # Add each variable to: GitHub repo → Settings → Secrets and variables → Actions.
        #
        # SECURITY: secrets are bound to step env vars so GitHub can mask them
        # in logs and they are never raw-interpolated into the shell script
        # string (prevents shell metacharacter injection — OWASP A03).
        env:
          _DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          _DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          _EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          _EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          _POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          _JWT_SECRET: ${{ secrets.JWT_SECRET }}
          _ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _SAGE_BRIDGE_URL: ${{ secrets.SAGE_BRIDGE_URL }}
          _SAGE_BRIDGE_KEY: ${{ secrets.SAGE_BRIDGE_KEY }}
          _SAGE_BRIDGE_WEBHOOK_SECRET: ${{ secrets.SAGE_BRIDGE_WEBHOOK_SECRET }}
          _GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          # printf '%s' prevents backslash-sequence interpretation in secret values.
          {
            printf 'DEEPSEEK_API_KEY=%s\n'            "$_DEEPSEEK_API_KEY"
            printf 'DEEPSEEK_MODEL=%s\n'              "$_DEEPSEEK_MODEL"
            printf 'EMAIL_FROM=%s\n'                  "$_EMAIL_FROM"
            printf 'EMAIL_PASS=%s\n'                  "$_EMAIL_PASS"
            printf 'POSTGRES_PASSWORD=%s\n'           "$_POSTGRES_PASSWORD"
            printf 'DATABASE_URL=postgresql://postgres:%s@db:5432/synbot_demo\n' "$_POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n'                  "$_JWT_SECRET"
            printf 'ADMIN_EMAIL=%s\n'                 "${_ADMIN_EMAIL:-}"
            printf 'ADMIN_PASSWORD=%s\n'              "$_ADMIN_PASSWORD"
            printf 'SAGE_BRIDGE_URL=%s\n'             "$_SAGE_BRIDGE_URL"
            printf 'SAGE_BRIDGE_KEY=%s\n'             "$_SAGE_BRIDGE_KEY"
            printf 'SAGE_BRIDGE_WEBHOOK_SECRET=%s\n'  "$_SAGE_BRIDGE_WEBHOOK_SECRET"
            printf 'HF_TOKEN=%s\n'                    "$_HF_TOKEN"
            printf 'GRAFANA_PASSWORD=%s\n'            "$_GRAFANA_PASSWORD"
            printf 'SAGE_MOCK=0\n'
            printf 'DEV_TOKEN_ENABLED=0\n'
          } > "$DEPLOY_DIR/backend/.env"
          chmod 600 "$DEPLOY_DIR/backend/.env"

      - name: Pull latest code
        run: |
          cd "$DEPLOY_DIR"
          git fetch origin main
          git reset --hard origin/main

      - name: Determine build flags
        id: flags
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "build_args=--no-cache" >> "$GITHUB_OUTPUT"
          else
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker images
        run: |
          cd "$DEPLOY_DIR/backend"
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            build ${{ steps.flags.outputs.build_args }}

      - name: Deploy containers (rolling restart)
        run: |
          cd "$DEPLOY_DIR/backend"
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --remove-orphans

      - name: Wait for backend health
        run: |
          echo "Waiting up to 90s for backend to become healthy..."
          for i in $(seq 1 18); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "Backend healthy after ${i}x5s"
              break
            fi
            sleep 5
          done
          curl -f http://localhost:8000/ || {
            echo "FAILED: Backend not healthy after 90s"
            docker compose -f "$DEPLOY_DIR/backend/docker-compose.yml" logs backend --tail 50
            exit 1
          }

      - name: Wait for frontend health
        run: |
          # -k = accept self-signed cert; -L = follow 80→43 redirect
          curl -sfkL https://localhost/ > /dev/null || {
            echo "FAILED: Frontend not responding on HTTPS"
            docker compose -f "$DEPLOY_DIR/backend/docker-compose.yml" logs frontend --tail 30
            exit 1
          }
          echo "Frontend healthy (HTTPS)"

      - name: Prune unused Docker images
        run: docker image prune -f

      - name: Deployment summary
        run: |
          echo "=== Deployment complete ==="
          docker compose \
            -f "$DEPLOY_DIR/backend/docker-compose.yml" \
            ps
