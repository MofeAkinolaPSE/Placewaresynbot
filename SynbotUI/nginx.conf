# ── Rate limiting zones (defined at http context via include, but nginx
#    allows limit_req_zone in server context for some builds; place here
#    so the conf.d include picks it up correctly) ──────────────────────────
# General API: 30 requests/second per IP, burst of 60 queued
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# Auth endpoints: stricter — 5 requests/second to slow brute force
limit_req_zone $binary_remote_addr zone=auth_limit:5m  rate=5r/s;

# ── HTTP → HTTPS redirect (with ACME challenge bypass) ───────────────────
# Port 80 is kept alive so Let's Encrypt (certbot --webroot) can satisfy the
# HTTP-01 challenge at /.well-known/acme-challenge/ without a service restart.
# All other HTTP traffic is upgraded to HTTPS with a permanent redirect.
server {
    listen 80;
    server_name _;

    # ACME challenge — must NOT be redirected; certbot writes here for renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Sage report / bank statement uploads (ACE Books migration) exceed the 1 MB default.
    client_max_body_size 25m;

    # ── TLS (OWASP TLS Cheat Sheet — Mozilla Intermediate profile) ───────
    ssl_certificate     /etc/ssl/placeware/cert.pem;
    ssl_certificate_key /etc/ssl/placeware/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling — reduces handshake latency and proves cert is not revoked.
    # Enabled automatically when cert.pem is CA-signed (Let's Encrypt / real CA).
    # Nginx silently ignores this for self-signed certs so it is safe to always set.
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout        5s;
    # Let's Encrypt fullchain includes the OCSP URL; no extra ssl_trusted_certificate needed.

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/x-javascript application/xml
        image/svg+xml font/woff font/woff2;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin"        always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version from error pages and headers
    server_tokens off;

    # ── Proxy timeouts for LLM responses (DeepSeek can be slow) ─────────
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;

    # ── WebSocket proxy for real-time channels ────────────────────────────
    # ^~ takes precedence over regex so WebSocket upgrade headers are applied
    location ^~ /realtime/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep WebSocket connections alive for long-running subscriptions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # No rate limiting on WebSocket upgrades (connection already authenticated)
    }

    # ── ACE Books migration uploads: large Sage journals take minutes to parse ──
    location ^~ /fin/migration/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }

    # ── Auth endpoints — strict rate limit (brute-force protection) ───────
    location ~ ^/(auth|token|refresh|logout) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy all backend API routes to FastAPI ───────────────────────────
    location ~ ^/(chat|users|submit_lead|dashboard|inventory|staff|timesheets|sage|analytics|intelligence|reports|workflow|audit|stock|hr|ops|crm|workspace|procurement|webhook|sop|compliance|maintenance|projects|orders|calendar|kg|agents|eos|docs|openapi.json|health|realtime|billing|cache|tasks|capability|custody|data|twin|finance|fin/|frontdesk|iot|promotions|qc|quality/|replenishment|ui|threads|knowledge|api|schemas|reconcile|events|suppliers|logistics|documents|controls|imports|license/|presence/|explorer/|admin/|submit_order) {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets — long cache, no rate limit ─────────────────────────
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Serve React SPA — all other routes return index.html ─────────────
    # index.html must never be cached: it names the current hashed bundles, and a
    # stale copy keeps loading the previous release after a deploy.
    # (add_header here replaces the server-level headers, so they are repeated.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options           "SAMEORIGIN"           always;
        add_header X-Content-Type-Options    "nosniff"              always;
        add_header X-XSS-Protection          "1; mode=block"        always;
        add_header Referrer-Policy           "strict-origin"        always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
