server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase timeout for LLM responses (DeepSeek can take several seconds)
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;

    # ── Proxy all backend API routes to FastAPI ───────────────────────────
    location ~ ^/(chat|auth|token|refresh|logout|users|submit_lead|dashboard|inventory|staff|timesheets|sage|analytics|intelligence|reports|workflow|audit|stock|hr|ops|crm|procurement|webhook|sop|compliance|maintenance|projects|orders|calendar|kg|agents|eos|docs|openapi.json|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Serve React SPA — all other routes return index.html ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
