# Security headers for every HTTPS response (ZAP scan of 8 Oct 2026: CSP, HSTS and
# X-Content-Type-Options were missing on the SPA and its assets).
#
# nginx drops ALL server-level add_header lines inside a location that has an add_header of its
# own (the static-assets block sets Cache-Control, so assets went out with no security headers).
# Every location that uses add_header must therefore `include` this file as well.
#
# The Content-Security-Policy value is chosen per path by the `map $uri $csp` in nginx.conf.

add_header Content-Security-Policy           $csp                                        always;
add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains"       always;
add_header X-Content-Type-Options            "nosniff"                                   always;
add_header X-Frame-Options                   "SAMEORIGIN"                                always;
add_header Referrer-Policy                   "strict-origin"                             always;
# geolocation is used by the CRM lead finder ("use my location") and rider tracking
add_header Permissions-Policy                "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header X-Permitted-Cross-Domain-Policies "none"                                      always;
# the legacy XSS auditor is switched off (OWASP advice): it can itself be abused, and CSP replaces it
add_header X-XSS-Protection                  "0"                                         always;
