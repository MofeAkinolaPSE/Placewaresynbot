# ── PlacewareBot — Kubernetes Secrets ─────────────────────────────────────
# Fill in every <REPLACE> value before running: kubectl apply -f 01-secrets.yaml
# Use stringData — K8s base64-encodes automatically; no manual encoding needed.
#
# IMPORTANT: Never commit this file with real values. Add 01-secrets.yaml to
# .gitignore after filling in credentials. The .env.example in backend/ is the
# source of truth for what goes here.
apiVersion: v1
kind: Secret
metadata:
  name: placeware-secrets
  namespace: placeware
type: Opaque
stringData:
  # ── Database ──────────────────────────────────────────────────────────────
  POSTGRES_PASSWORD: "<REPLACE — strong password, min 20 chars>"
  # Full connection string — replace <REPLACE_PW> with the same password above
  DATABASE_URL: "postgresql://postgres:<REPLACE_PW>@db:5432/synbot_demo"

  # ── LLM (DeepSeek) ────────────────────────────────────────────────────────
  DEEPSEEK_API_KEY: "<REPLACE — from DeepSeek dashboard>"

  # ── Email ─────────────────────────────────────────────────────────────────
  EMAIL_FROM: "Warebot1@gmail.com"
  EMAIL_PASS: "<REPLACE — Gmail App Password (not your login password)>"

  # ── Auth & Security ───────────────────────────────────────────────────────
  # Generate: python -c "import secrets; print(secrets.token_hex(64))"
  JWT_SECRET: "<REPLACE — 128-char hex string>"
  WEBHOOK_SECRET: "<REPLACE — generate same way as JWT_SECRET>"
  AT_REST_KEY: "<REPLACE — generate same way as JWT_SECRET>"

  # ── Admin seed account ────────────────────────────────────────────────────
  ADMIN_EMAIL: "admin@placeware.com"
  ADMIN_PASSWORD: "<REPLACE — strong password>"

  # ── Sage Bridge ───────────────────────────────────────────────────────────
  SAGE_BRIDGE_KEY: "placeware-bridge-prod-key-<REPLACE>"

  # ── Termii SMS (optional — leave empty if unused) ─────────────────────────
  TERMII_API_KEY: ""

  # ── Widget site keys (comma-separated) ────────────────────────────────────
  WIDGET_SITE_KEYS: "site_prod_<REPLACE>,site_staging_<REPLACE>"
