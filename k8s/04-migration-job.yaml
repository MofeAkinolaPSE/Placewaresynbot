# ── PlacewareBot — Database Migration Job ────────────────────────────────
#
# WHY a Job instead of running migrations in each backend pod:
#   Multiple backend replicas starting simultaneously would race to apply the
#   same SQL migrations, risking duplicate-column or constraint errors.
#   A Job runs once, completes, and the backend Deployment starts only after.
#
# APPLY ORDER: apply this AFTER 03-postgres.yaml is healthy, BEFORE 05-backend.yaml
#
# Re-run after schema changes:
#   kubectl delete job placeware-migrate -n placeware
#   kubectl apply -f 04-migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: placeware-migrate
  namespace: placeware
  labels:
    app: placeware-migrate
    app.kubernetes.io/part-of: placewarebot
spec:
  # Retry up to 3 times if migrations fail (e.g. DB not yet ready)
  backoffLimit: 3
  # Clean up completed/failed pods after 10 minutes
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: placeware-migrate
    spec:
      restartPolicy: OnFailure

      # Wait for Postgres to be accepting connections before running migrations
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres to be ready..."
              until nc -z db 5432; do
                echo "  db:5432 not ready — sleeping 3s"
                sleep 3
              done
              echo "Postgres is ready."

      containers:
        - name: migrate
          image: placeware-backend:latest
          imagePullPolicy: IfNotPresent
          # Override entrypoint to ONLY run migrations — no uvicorn
          command: ["python", "scripts/apply_migrations.py"]
          env:
            # Pull all env vars from the same sources the backend uses
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: placeware-secrets
                  key: DATABASE_URL
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: placeware-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: placeware-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: placeware-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
