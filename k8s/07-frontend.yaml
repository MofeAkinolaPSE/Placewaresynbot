# ── PlacewareBot — React Frontend Deployment + Service ────────────────────
#
# The nginx container serves the React SPA and proxies all API routes
# to http://backend:8000 (see SynbotUI/nginx.conf).
# "backend" resolves to the backend Service ClusterIP via K8s DNS —
# no nginx config changes are needed.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: placeware
  labels:
    app: frontend
    app.kubernetes.io/part-of: placewarebot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 10

      # Wait for backend to be reachable before accepting user traffic
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for backend service..."
              until nc -z backend 8000; do
                echo "  backend:8000 not ready — sleeping 3s"
                sleep 3
              done
              echo "Backend ready."

      containers:
        - name: frontend
          image: placeware-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: placeware
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
